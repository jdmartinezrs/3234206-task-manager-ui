<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <title>Crear Tarea - Task Manager UI</title>
</head>

<body>

    <div id="grid">
        <header class="header">
            <div class="header__title"><h1>Nueva Tarea</h1></div>
            <div class="header__icons">
                <div class="header__search"></div>
                <div class="header__bell"></div>
                <div class="header__avatar"></div>
            </div>
        </header>

        <aside class="aside">
            <div class="aside__logo"></div>
            <nav class="aside__nav">
                <ul class="aside__list">
                    <li class="aside__item aside__dasboard">
                        <div class="aside__img--dashboard"></div>
                        <a class="aside__link" href="Panel.html">Dashboard</a>
                    </li>
                    <li class="aside__item aside__crear_tarea">
                        <div class="aside__img--crear_tarea"></div>
                        <a class="aside__link" href="crear_tarea.html">Crear Tarea</a>
                    </li>
                    <li class="aside__item aside__cerrar_sesion">
                        <div class="aside__img--cerrar_sesion"></div>
                        <a class="aside__link" href="../index.html">Cerrar sesión</a>
                    </li>
                </ul>
            </nav>
        </aside>
  
        <main class="dashboard">
            <div class="form-container">
                <div class="form-header">
                    <a href="Panel.html" class="btn-back"><span></span> Crear Nueva Tarea</a>
                </div>

                <form action="#" method="POST" class="task-form">
                    
                    <div class="form-group">
                        <label for="titulo">Título:</label>
                        <input type="text" id="titulo" name="titulo" required>
                    </div>

                    <div class="form-group">
                        <label for="descripcion">Descripción:</label>
                        <textarea id="descripcion" name="descripcion" rows="4" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="fecha">Fecha de Vencimiento:</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>

                    <div class="form-group">
                        <label for="prioridad">Prioridad:</label>
                        <select id="prioridad" name="prioridad" required>
                            <option value="alta">Alta</option>
                            <option value="media">Media</option>
                            <option value="baja">Baja</option>
                        </select>
                    </div>

                    <div class="form-footer">
                        <a href="./Panel.html" class="btn-primary" style="text-decoration: none; display: inline-block; text-align: center;">Crear Tarea</a>
                    </div>
                </form>
            </div>
        </main>

        <footer class="footer">
            <p class="footer_message">“Convierte tus ideas en tareas… y tus tareas en logros.”</p>
        </footer>
    </div>

</body>
</html>
